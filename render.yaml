# Render Blueprint for the API. The database lives on Neon; paste its connection string into DATABASE_URL.
services:
  - type: web
    name: engagement-tracker-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run on every deploy before the server starts (idempotent).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
